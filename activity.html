<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="margin: 30px; border: 5px solid black">  
        <h1> My Activity </h1>
            <form>
                <input  id="name-input" type="text" placeholder="Enter your name" required>
                <button type="submit" id="submit-btn">Submit</button>
            </form>
    </div>
    <script>
        const demoButton = document.querySelector('#submit-btn');
        const nameInput = document.querySelector('#name-input');
     demoButton.addEventListener('click',(event) => {
           alert('button clicked');
            event.preventDefault();
            console.log(`Name entered: ${nameInput.value}`);
     });
    </script>
</body>
</html>
