<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure and Table</title>
</head>
<body>

    <!-- Figure -->
    <figure>
        <img src="images/tajmahal.jpg" alt="Taj Mahal" width="300" height="400">
        <figcaption>Famous monument in India.</figcaption>
    </figure>

    <br>

    <!-- Table -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Technology</th>
                <th>Year Created</th>
                <th>Created By</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML</td>
                <td>1991</td>
                <td>Tim Berners-Lee</td>
            </tr>

            <tr>
                <td>CSS</td>
                <td>1996</td>
                <td>Håkon Wium Lie</td>
            </tr>

            <tr>
                <td>JavaScript</td>
                <td>1995</td>
                <td>Brendan Eich</td>
            </tr>

            <tr>
                <td>Python</td>
                <td>1991</td>
                <td>Guido van Rossum</td>
            </tr>

            <tr>
                <td>C</td>
                <td>1972</td>
                <td>Dennis Ritchie</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
